server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static images
    location /images/ {
        expires 5s;
        try_files $uri /images/placeholder.jpg;
    }

    # Kubernetes health probes
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Frontend application
    location / {
        try_files $uri $uri/ /index.html;
    }
}