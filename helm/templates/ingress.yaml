
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: frontend
  namespace: frontend
  labels:
    app: frontend
    project: roboshop

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

spec:
  ingressClassName: alb

  rules:
    - host: dev.optimusprime.uno
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
