apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: frontend
  namespace: frontend
  labels:
    app: frontend
    project: roboshop

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:717090908085:certificate/a1f104d7-13da-4c0a-ace6-c3ec5ad44d7c
    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: alb

  rules:
    - host: dev.optimusprime.uno
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
