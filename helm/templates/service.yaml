apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: ns-nginx
  labels:
    app: frontend
    project: roboshop

spec:
  type: ClusterIP

  selector:
    app: frontend
    project: roboshop

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80


