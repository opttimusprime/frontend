apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: ns-nginx
  labels:
    app: frontend
    project: roboshop

spec:
  replicas: 2

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: frontend
      project: roboshop

  template:
    metadata:
      labels:
        app: frontend
        project: roboshop

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: frontend

          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
