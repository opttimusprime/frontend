
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: frontend
  labels:
    app: frontend
    project: roboshop

spec:
  replicas: 2
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: frontend
      project: roboshop

  template:
    metadata:
      labels:
        app: frontend
        project: roboshop

    spec:
      containers:
        - name: frontend
          image: "717090908085.dkr.ecr.us-east-1.amazonaws.com/roboshop/frontend@{{ required "image.digest must be provided" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
